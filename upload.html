<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OFF-REV | Upload Reviewer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        📂
    </div>

    <h1>Upload Reviewer</h1>

    <p class="subtitle">
        Add your reviewer file to OFF-REV
    </p>

    <div class="welcome-card">

        <h2>Select a Reviewer File</h2>

        <p>
            Choose your reviewer file.
            <br>
            <strong>Supported: TXT, CSV, DOCX, PDF</strong>
        </p>

        <input
    type="file"
    id="reviewerFile"
    accept=".txt,.csv,.docx,.pdf"
>
        
        <br><br>

        <button onclick="uploadFile()">
    📚 Generate Reviewer
</button>

        <br><br>

        <button onclick="location.href='index.html'">
    ← Back
</button>

        <p id="message"></p>

    </div>

</div>


<!-- DOCX READER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

<script>
    console.log("Mammoth loaded:", typeof mammoth);
</script>

<!-- PDF READER -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    console.log("PDF.js loaded:", typeof window.pdfjsLib);
</script>

<!-- OFF-REV -->
<script src="upload.js?v=5"></script>

</body>
</html>
