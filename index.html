<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OFF-REV | Offline Reviewer</title>

    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <div class="container">

        <div class="logo">
            📚
        </div>

        <h1>OFF-REV</h1>

        <p class="subtitle">
            Offline Reviewer System
        </p>

        <div class="welcome-card">

            <h2>Welcome to OFF-REV!</h2>

            <p>
                Your simple offline reviewer for studying,
                memorization, and practice.
            </p>

            <button onclick="location.href='upload.html'">
                📂 Upload Reviewer
            </button>

        </div>

        <p class="offline">
            🔒 Works Offline
        </p>

    </div>

    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js")
                .then(() => {
                    console.log("OFF-REV Offline Mode Ready");
                })
                .catch(error => {
                    console.error("Service Worker Error:", error);
                });
        });
    }
</script>

</body>
</html>
